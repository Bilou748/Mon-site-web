<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Description de ta page pour le SEO">
    <title>Titre de ta page - Nom du site</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- En-tête commun à toutes les pages -->
    <header>
        <div class="logo">
            <h1>Nom de ton site</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="page2.html">Page 2</a></li>
                <li><a href="page3.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenu principal spécifique à chaque page -->
  
  <main>
    <article>
        <h2>Premier article</h2>
        <p>Contenu de l'article...</p>
    </article>
    
    <section>
        <h2>Contactez-moi</h2>
        <form>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>
            
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message :</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit">Envoyer</button>
        </form>
    </section>
</main>

    <!-- Pied de page commun -->
    <footer>
        <p>© 2026 Nom de ton site. Tous droits réservés.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
